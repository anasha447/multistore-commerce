store:
  id: ${STORE_ID}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}

spring:
  application:
    name: store
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    # the owner migrates, the app role never can
    url: ${spring.datasource.url}
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}
    default-schema: shop
    create-schemas: false
    placeholders:
      app_role: ${spring.datasource.username}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: shop
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC
  jackson:
    # what the contract was written against; Jackson 3 changed these defaults
    mapper:
      sort-properties-alphabetically: false
    deserialization:
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false
    factory:
      constraints:
        read:
          max-document-length: 262144
    write:
      write-bigdecimal-as-plain: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  data:
    web:
      pageable:
        max-page-size: 2000
        serialization-mode: via-dto
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER}
      password: ${REDIS_PASSWORD}
      timeout: 250ms
      connect-timeout: 250ms
      repositories:
        enabled: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          # Flyway creates the table
          enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY}
          jws-algorithms: RS256
          audiences: ${store.id}
          authorities-claim-name: roles
          authority-prefix: ROLE_
  threads:
    virtual:
      enabled: false

server:
  shutdown: graceful
  tomcat:
    threads:
      max: 50

management:
  server:
    # never published: only the container's health check and monitoring reach it
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # not Redis: without it the shop still works
          include: readinessState,db
  health:
    mail:
      enabled: false
    redis:
      # would need a command the app's user does not have
      enabled: false

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
