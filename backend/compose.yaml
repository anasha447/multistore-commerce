# Local development only. Production has its own file under deploy/.
# First run: node scripts/setup-local.mjs (from the repository root)
name: multistore

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?run scripts/setup-local.mjs first}
      STORES: matessa
      MATESSA_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?run scripts/setup-local.mjs first}
      MATESSA_APP_PASSWORD: ${DB_APP_PASSWORD:?run scripts/setup-local.mjs first}
      MATESSA_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?run scripts/setup-local.mjs first}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-stores.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?run scripts/setup-local.mjs first} --maxmemory 96mb --maxmemory-policy volatile-lru --save ""
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

volumes:
  pgdata: {}
