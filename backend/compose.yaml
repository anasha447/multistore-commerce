# Local development only. Production has its own file under deploy/.
# First run: node scripts/setup-local.mjs (from the repository root)
name: multistore

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matessa
      POSTGRES_USER: ${DB_USER:?run scripts/setup-local.mjs first}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run scripts/setup-local.mjs first}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d matessa"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?run scripts/setup-local.mjs first} --maxmemory 96mb --maxmemory-policy volatile-lru --save ""
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

volumes:
  pgdata: {}
